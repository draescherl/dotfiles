[bar]
order = [ "default", "custom" ]

    [bar.custom]
    background_opacity = 0.59999998658895493
    border = "on_surface"
    capsule = true
    concave_edge_corners = false
    enabled = true
    end = [ "group:g4", "group:g3", "group:g2", "group:g1" ]
    font_family = "JetBrainsMono Nerd Font"
    font_weight = 700
    margin_edge = 4
    margin_ends = 3
    shadow = false
    thickness = 40

        [[bar.custom.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "notifications", "session", "control-center" ]
        opacity = 1.0
        padding = 6.0

        [[bar.custom.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "volume", "brightness", "battery" ]
        opacity = 1.0
        padding = 6.0

        [[bar.custom.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "network", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.custom.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "temp", "cpu", "ram" ]
        opacity = 1.0
        padding = 6.0

    [bar.default]
    enabled = false

[battery]
warning_threshold = 20

    [battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
    warning_threshold = 20

[control_center]
sidebar = "compact"
sidebar_section = "compact"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "nightlight"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1720.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1720.0
    cy = 883.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 64.0
    box_width = 400.0
    cx = 1066.5
    cy = 760.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 480.0
    cx = 1066.5
    cy = 488.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        font_family = "JetBrainsMono Nerd Font"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 208.0
    box_width = 864.0
    cx = 1720.0
    cy = 528.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        clock_style = "digital"

[notification]
layer = "overlay"

[shell]
external_ip_enabled = true
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    clipboard_placement = "floating"
    control_center_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    session_placement = "floating"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    label = "Log Out"
    shortcut = "e"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "x"
    variant = "destructive"

[theme]
builtin = "Gruvbox"
community_palette = "Everforest Alt"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "niri" ]

[wallpaper]
directory = "/home/lucas/wallpapers"
transition = [ "fade" ]
transition_duration = 500

    [wallpaper.default]
    path = "/home/lucas/wallpapers/water/water-4.jpg"

    [wallpaper.last]
    path = "/home/lucas/wallpapers/water/water-4.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lucas/wallpapers/water/water-4.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/lucas/wallpapers/water/water-4.jpg"

[widget.clock]
format = "{:%a, %d %b, %R}"

[widget.control-center]
glyph = "adjustments"

[widget.cpu]
show_label = false

[widget.network]
show_label = false

[widget.ram]
show_label = false

[widget.taskbar]
group_by_workspace = true

[widget.temp]
show_label = false

[widget.workspaces]
hide_when_empty = true
labels_only_when_occupied = true
