format = """
$custom\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$python\
$nix_shell\
$cmd_duration\
$character
"""

add_newline = false

[custom.exherbo]
command = "echo '[exherbo]'"
when = "test -f /etc/paludis/options.conf"
format = "[$output]($style) "
style = "bold red"

[python]
format = '[(\($virtualenv\) )]($style)'

[cmd_duration]
min_time = 1_000
show_notifications = false
min_time_to_notify = 30_000
format = 'took [$duration](bold yellow) '

[directory]
read_only = " "
truncation_length = 1
truncate_to_repo = false

[git_branch]
symbol = " "

[nix_shell]
symbol = ' '
